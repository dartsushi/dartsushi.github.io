name: Check for broken links

on:
  push:
    branches:
      - master
      - main
    paths:
      - ".lycheeignore"
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"
  pull_request:
    branches:
      - master
      - main
    paths:
      - ".lycheeignore"
      - "assets/**"
      - "**.html"
      - "**.js"
      - "**.liquid"
      - "**/*.md"
      - "**.yml"
      - "!.github/workflows/axe.yml"
      - "!.github/workflows/deploy-docker-tag.yml"
      - "!.github/workflows/deploy-image.yml"
      - "!.github/workflows/docker-slim.yml"
      - "!.github/workflows/lighthouse-badger.yml"
      - "!.github/workflows/prettier.yml"
      - "!lighthouse_results/**"

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install link checker
        env:
          LYCHEE_VERSION: v0.17.0
        run: |
          mkdir -p "$RUNNER_TEMP/lychee"
          curl --fail --show-error --location \
            --retry 3 --retry-all-errors --retry-delay 5 \
            --connect-timeout 15 --max-time 120 \
            --output "$RUNNER_TEMP/lychee.tar.gz" \
            "https://github.com/lycheeverse/lychee/releases/download/lychee-${LYCHEE_VERSION}/lychee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf "$RUNNER_TEMP/lychee.tar.gz" -C "$RUNNER_TEMP/lychee"

      - name: Link Checker 🔗
        env:
          GITHUB_TOKEN: ${{ github.token }}
        # Limit checks to website sources and ignore unrendered Jekyll Liquid links.
        run: |
          "$RUNNER_TEMP/lychee/lychee" \
            --format markdown --output "$GITHUB_STEP_SUMMARY" \
            --user-agent 'curl/7.54' \
            --exclude '%7B%7B.*(relative_url|absolute_url).*%7D%7D' \
            --exclude-path _pages/404.md \
            --exclude-path _pages/blog.md \
            --verbose --no-progress \
            './_pages/**/*.md' './_news/**/*.md' './assets/html/**/*.html'
          if grep -Eq 'Total[[:space:]]*\|[[:space:]]*0' "$GITHUB_STEP_SUMMARY"; then
            echo "::error::No links were found. Check the link-checker input paths."
            exit 1
          fi
